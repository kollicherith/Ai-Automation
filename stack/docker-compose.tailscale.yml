# Private mode: n8n is published on the loopback only and reached through
# `tailscale serve`, which terminates HTTPS with a Tailscale-issued certificate.
# No Caddy, no DuckDNS, no ports open to the internet.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROXY_HOPS=1
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      # Keep the SQLite database from growing without bound (troubleshooting.md 8).
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-warn}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback only. tailscale serve is the sole way in.
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  n8n_data:
